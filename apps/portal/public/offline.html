<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2f3d">
<title>No connection | Lexta Business System</title>
<style>
  :root { --navy:#0b2f3d; --teal:#12a3c4; --teal-dark:#0d8ba8; --ink:#14313d; --muted:#5d7883; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         font-family: Poppins, Helvetica, Arial, sans-serif; background:var(--navy); color:#fff; text-align:center; }
  .card { max-width:380px; width:100%; background:#fff; color:var(--ink); border-radius:18px; padding:28px 22px; }
  img { width:96px; height:96px; border-radius:20px; }
  h1 { font-size:22px; margin:16px 0 8px; }
  p { color:var(--muted); line-height:1.6; margin:0 0 20px; font-size:15px; }
  button { width:100%; height:52px; border:0; border-radius:10px; background:var(--teal); color:#fff; font-weight:700; font-size:16px; cursor:pointer; }
  button:hover { background:var(--teal-dark); }
</style>
</head>
<body>
  <main class="card">
    <img src="/pwa/field-sales-192.png" alt="" onerror="this.remove()">
    <h1>You are offline</h1>
    <p>This page needs a connection. Move to a spot with signal, then try again. Anything you already saved is safe.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
